<?xml version="1.0"?>
<configuration kit="Houdini_Bridge" version="0.1.0">
  <import></import>

  <atom type="Attributes">

    <!-- button in the mode bar, top right -->
    <hash type="Sheet" key="HoudiniBridge_TailMenu:sheet">
      <atom type="Label">Houdini</atom>
      <atom type="Layout">htoolbar</atom>
      <atom type="Justification">left</atom>
      <atom type="IconMode">text</atom>
      <atom type="IconSize">small</atom>
      <hash type="InCategory" key="modoModesTail#tail">
        <atom type="Ordinal">49.48.64</atom>
      </hash>
      <list type="Control" val="sub 81463500201:sheet">
        <atom type="Label">Houdini</atom>
        <atom type="Style">popover</atom>
        <atom type="Hash">81463500201:sheet</atom>
      </list>
    </hash>

    <!-- the popover itself -->
    <hash type="Sheet" key="81463500201:sheet">
      <atom type="Label">Send to Houdini</atom>
      <atom type="Style">popover</atom>
      <atom type="Layout">vtoolbar</atom>

      <list type="Control" val="cmd houdini.send">
        <atom type="Label">Send to Houdini</atom>
        <atom type="Tooltip">Write the meshes (with material tags, parts and selection sets) to the bridge file and tell Houdini to reload it.</atom>
      </list>

      <list type="Control" val="div Options">
        <atom type="Alignment">full</atom>
        <atom type="Hash">81463500210:control</atom>
      </list>
      <list type="Control" val="cmd houdini.items ?">
        <atom type="Label">Items</atom>
        <atom type="Tooltip">All meshes, or the selected items and their children. The file always holds exactly what was sent last.</atom>
      </list>
      <list type="Control" val="cmd houdini.file ?">
        <atom type="Label">File</atom>
        <atom type="Tooltip">The USD file Houdini reads. .usdc is fast and small; .usda is text, handy for checking.</atom>
      </list>
      <list type="Control" val="cmd houdini.port ?">
        <atom type="Label">Port</atom>
        <atom type="Tooltip">Local port Houdini listens on (MODO_BRIDGE_PORT on the Houdini side).</atom>
      </list>
    </hash>

  </atom>

  <atom type="CommandHelp">
    <hash type="Command" key="houdini.send@en_US">
      <atom type="UserName">Send to Houdini</atom>
      <atom type="ButtonName">Send to Houdini</atom>
      <atom type="Desc">Write the evaluated meshes to a USD file and ask Houdini to reload it.</atom>
      <hash type="Argument" key="filename">
        <atom type="UserName">File</atom>
        <atom type="Desc">USD file to write; the File setting when omitted.</atom>
      </hash>
      <hash type="Argument" key="items">
        <atom type="UserName">Items</atom>
        <atom type="Desc">ALL or SELECTED; the Items setting when omitted.</atom>
      </hash>
    </hash>
    <hash type="Command" key="houdini.items@en_US">
      <atom type="UserName">Houdini Bridge Items</atom>
      <hash type="Argument" key="value">
        <atom type="UserName">Items</atom>
      </hash>
    </hash>
    <hash type="Command" key="houdini.file@en_US">
      <atom type="UserName">Houdini Bridge File</atom>
      <hash type="Argument" key="value">
        <atom type="UserName">File</atom>
      </hash>
    </hash>
    <hash type="Command" key="houdini.port@en_US">
      <atom type="UserName">Houdini Bridge Port</atom>
      <hash type="Argument" key="value">
        <atom type="UserName">Port</atom>
      </hash>
    </hash>
  </atom>
</configuration>
